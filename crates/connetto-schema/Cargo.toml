[package]
name = "connetto-schema"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Diesel models and description of the connetto-schema workspace, generated by synql."

[dependencies]
serde = { workspace = true, optional = true }
diesel-builders = { workspace = true, optional = true }
diesel = { workspace = true, features = ["postgres_backend"], optional = true }
validation-errors = { workspace = true, optional = true }
rosetta-uuid = { workspace = true, optional = true }
rosetta-utc = { workspace = true, optional = true }
serde_json = { workspace = true, optional = true }

[features]
default = ["models", "sqlite"]
models = ["dep:serde", "dep:diesel-builders", "dep:diesel", "dep:validation-errors", "dep:rosetta-uuid", "dep:rosetta-utc", "dep:serde_json"]
sqlite = ["models", "diesel/sqlite", "diesel-builders/sqlite", "rosetta-uuid/sqlite", "rosetta-utc/sqlite"]

[lints]
workspace = true
