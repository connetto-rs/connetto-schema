ALTER FUNCTION authz.residual_read_reached() OWNER TO authz_owner;
ALTER FUNCTION authz.residual_read_resources() OWNER TO authz_owner;
ALTER FUNCTION authz.organization_resources_with(authz.resource_kind) OWNER TO authz_owner;
REVOKE EXECUTE ON ALL FUNCTIONS IN SCHEMA authz FROM PUBLIC, app;
GRANT EXECUTE ON ALL FUNCTIONS IN SCHEMA authz TO app;
GRANT EXECUTE ON FUNCTION authz.caller_id() TO identity_writer;
-- The walk returns resources before the installation's kind cap applies, so only definer helpers call it.
REVOKE EXECUTE ON FUNCTION authz.containers_with(authz.role, BOOLEAN), authz.reached_with(authz.role, BOOLEAN) FROM app;
REVOKE EXECUTE ON FUNCTION authz.residual_read_containers(), authz.residual_read_reached() FROM app;
GRANT EXECUTE ON FUNCTION authz.refuse_repeatable_read() TO PUBLIC;

REVOKE ALL ON grantees, users, platform_operators, organizations, memberships, invitations, teams, team_members, resources, grants, user_grants, share_links, user_blocks, installation_blocks, apps, app_installations, installation_permissions, audit_events, platform_audit_events FROM PUBLIC, app, identity_writer;
REVOKE ALL ON namespaces FROM PUBLIC, app, identity_writer;

GRANT SELECT ON namespaces TO app;
CREATE POLICY namespaces_select ON namespaces FOR SELECT TO app
  USING (id = (SELECT authz.caller_namespace()) OR reserved);

-- The replica runs authz.caller_grantees() itself, so the caller's own grantee rows reach it.
-- Every other grantee is readable with the team, organization, link or installation it stands for.
GRANT SELECT ON grantees TO app;
CREATE POLICY grantees_select ON grantees FOR SELECT TO app
  USING ((namespace_id, id) IN (SELECT * FROM authz.caller_grantees())
    OR (kind = 'team' AND (namespace_id, id) IN (SELECT team.namespace_id, team.id FROM teams team))
    OR (kind = 'organization'
      AND (namespace_id, id) IN (SELECT organization.namespace_id, organization.id FROM organizations organization))
    OR (kind = 'link' AND (namespace_id, id) IN (SELECT link.namespace_id, link.id FROM share_links link))
    OR (kind = 'installation'
      AND (namespace_id, id) IN (SELECT installation.namespace_id, installation.id FROM app_installations installation)));

GRANT SELECT ON users TO app;
GRANT SELECT, INSERT (id) ON users TO identity_writer;
CREATE POLICY users_select ON users FOR SELECT TO app
  USING ((id = (SELECT authz.caller_id()))
    OR id IN (SELECT authz.co_member_users()));
CREATE POLICY users_identity_select ON users FOR SELECT TO identity_writer
  USING (id = (SELECT authz.caller_id()));
-- The identity service provisions only the subject it authenticated for the session.
CREATE POLICY users_insert ON users FOR INSERT TO identity_writer
  WITH CHECK (id = (SELECT authz.caller_id()));

GRANT SELECT, DELETE ON organizations TO app;
GRANT INSERT (namespace_id, id, created_by_id) ON organizations TO app;
CREATE POLICY organizations_select ON organizations FOR SELECT TO app
  USING ((namespace_id, id) IN (SELECT * FROM authz.organizations_reaching('reader'))
    OR (namespace_id, id) IN (SELECT * FROM authz.member_organizations())
    OR ((namespace_id, id) IN (SELECT * FROM authz.founded_organizations())
      AND (SELECT authz.acting_installation_id()) IS NULL)
    OR (namespace_id, id) IN (SELECT invitation.organization_namespace_id, invitation.organization_id
      FROM invitations invitation WHERE invitation.accepted_by_id IS NULL AND invitation.expires_at > now()));
CREATE POLICY organizations_delete ON organizations FOR DELETE TO app
  USING ((namespace_id, id) IN (SELECT * FROM authz.organizations_with('admin')));
CREATE POLICY organizations_insert ON organizations FOR INSERT TO app
  WITH CHECK (namespace_id = (SELECT authz.caller_namespace())
        AND created_by_id = (SELECT authz.caller_id()) AND (SELECT authz.acting_installation_id()) IS NULL);

GRANT SELECT, INSERT, UPDATE (state), DELETE ON memberships TO app;
CREATE POLICY memberships_select ON memberships FOR SELECT TO app
  USING ((organization_namespace_id, organization_id) IN (SELECT * FROM authz.member_organizations())
    OR (organization_namespace_id, organization_id) IN (SELECT * FROM authz.organizations_with('admin'))
    OR (user_id = (SELECT authz.caller_id())
      AND ((SELECT authz.acting_installation_id()) IS NULL
        OR (organization_namespace_id, organization_id, 'organization'::authz.resource_kind)
          IN (SELECT * FROM authz.capped_kinds('reader')))));
-- Members join only by founding or by accepting an invitation.
CREATE POLICY memberships_insert ON memberships FOR INSERT TO app
  WITH CHECK (((organization_namespace_id, organization_id) IN (SELECT * FROM authz.founded_organizations())
      AND user_id = (SELECT authz.caller_id())
      AND state = 'active' AND invitation_id IS NULL
      AND (SELECT authz.acting_installation_id()) IS NULL)
    OR ((organization_namespace_id, organization_id, invitation_id) IN (SELECT * FROM authz.pending_invitations())
      AND user_id = (SELECT authz.caller_id())
      AND state = 'active'
      AND ((SELECT authz.acting_installation_id()) IS NULL
        OR (organization_namespace_id, organization_id, 'organization'::authz.resource_kind)
          IN (SELECT * FROM authz.capped_kinds('writer')))));
CREATE POLICY memberships_update ON memberships FOR UPDATE TO app
  USING ((organization_namespace_id, organization_id) IN (SELECT * FROM authz.organizations_with('admin')))
  WITH CHECK ((organization_namespace_id, organization_id) IN (SELECT * FROM authz.organizations_with('admin')));
CREATE POLICY memberships_delete ON memberships FOR DELETE TO app
  USING ((organization_namespace_id, organization_id) IN (SELECT * FROM authz.organizations_with('admin'))
    OR (user_id = (SELECT authz.caller_id())
      AND state = 'active'
      AND ((SELECT authz.acting_installation_id()) IS NULL
        OR (organization_namespace_id, organization_id, 'organization'::authz.resource_kind)
          IN (SELECT * FROM authz.capped_kinds('writer')))));

GRANT SELECT, DELETE ON invitations TO app;
GRANT INSERT (id, organization_namespace_id, organization_id, email, expires_at, invited_by_id)
  ON invitations TO app;
CREATE POLICY invitations_select ON invitations FOR SELECT TO app
  USING ((organization_namespace_id, organization_id) IN (SELECT * FROM authz.organizations_with('admin'))
    OR (email = (SELECT authz.verified_email())
      AND ((SELECT authz.acting_installation_id()) IS NULL
        OR (organization_namespace_id, organization_id, 'organization'::authz.resource_kind)
          IN (SELECT * FROM authz.capped_kinds('reader')))));
CREATE POLICY invitations_insert ON invitations FOR INSERT TO app
  WITH CHECK ((organization_namespace_id, organization_id) IN (SELECT * FROM authz.organizations_with('admin'))
        AND invited_by_id = (SELECT authz.caller_id()));
CREATE POLICY invitations_delete ON invitations FOR DELETE TO app
  USING ((organization_namespace_id, organization_id) IN (SELECT * FROM authz.organizations_with('admin')));

GRANT SELECT, INSERT, UPDATE (parent_namespace_id, parent_id), DELETE ON teams TO app;
CREATE POLICY teams_select ON teams FOR SELECT TO app
  USING ((organization_namespace_id, organization_id) IN (SELECT * FROM authz.member_organizations())
    OR (organization_namespace_id, organization_id) IN (SELECT * FROM authz.organizations_with('admin')));
CREATE POLICY teams_insert ON teams FOR INSERT TO app
  WITH CHECK (namespace_id = (SELECT authz.caller_namespace())
    AND ((organization_namespace_id, organization_id) IN (SELECT * FROM authz.organizations_with('admin'))
      OR ((parent_namespace_id, parent_id) IN (SELECT * FROM authz.administered_teams())
        AND (organization_namespace_id, organization_id) IN (SELECT * FROM authz.team_admin_organizations()))));
CREATE POLICY teams_delete ON teams FOR DELETE TO app
  USING ((organization_namespace_id, organization_id) IN (SELECT * FROM authz.organizations_with('admin')));
CREATE POLICY teams_update ON teams FOR UPDATE TO app
  USING ((organization_namespace_id, organization_id) IN (SELECT * FROM authz.organizations_with('admin')))
  WITH CHECK ((organization_namespace_id, organization_id) IN (SELECT * FROM authz.organizations_with('admin')));

GRANT SELECT, INSERT, UPDATE (team_role), DELETE ON team_members TO app;
CREATE POLICY team_members_select ON team_members FOR SELECT TO app
  USING ((organization_namespace_id, organization_id) IN (SELECT * FROM authz.member_organizations())
    OR (organization_namespace_id, organization_id) IN (SELECT * FROM authz.organizations_with('admin')));
CREATE POLICY team_members_insert ON team_members FOR INSERT TO app
  WITH CHECK ((organization_namespace_id, organization_id) IN (SELECT * FROM authz.organizations_with('admin'))
    OR ((team_namespace_id, team_id) IN (SELECT * FROM authz.administered_teams())
      AND (organization_namespace_id, organization_id) IN (SELECT * FROM authz.team_admin_organizations())));
CREATE POLICY team_members_update ON team_members FOR UPDATE TO app
  USING ((organization_namespace_id, organization_id) IN (SELECT * FROM authz.organizations_with('admin'))
    OR (team_namespace_id, team_id) IN (SELECT * FROM authz.administered_teams()))
  WITH CHECK ((organization_namespace_id, organization_id) IN (SELECT * FROM authz.organizations_with('admin'))
    OR (team_namespace_id, team_id) IN (SELECT * FROM authz.administered_teams()));
CREATE POLICY team_members_delete ON team_members FOR DELETE TO app
  USING ((organization_namespace_id, organization_id) IN (SELECT * FROM authz.organizations_with('admin'))
    OR (team_namespace_id, team_id) IN (SELECT * FROM authz.administered_teams()));

GRANT SELECT, INSERT (id, kind, organization_namespace_id, organization_id, parent_id, parent_kind,
    created_by_id, archived_at, writers_can_share),
  UPDATE (archived_at, writers_can_share), DELETE
  ON resources TO app;
CREATE POLICY resources_select ON resources FOR SELECT TO app
  USING ((kind = 'ownable'
      AND (organization_namespace_id, organization_id) IN (SELECT * FROM authz.organization_resources_with('ownable')))
    OR (kind IN ('organization', 'folder', 'project')
      AND (organization_namespace_id, organization_id) IN (SELECT * FROM authz.organizations_with('reader'))
      AND ((SELECT authz.acting_installation_id()) IS NULL
        OR (organization_namespace_id, organization_id, kind) IN (SELECT * FROM authz.capped_kinds('reader'))))
    OR id = ANY (ARRAY(SELECT authz.residual_read_resources()))
    OR ((organization_namespace_id, organization_id) IN (SELECT * FROM authz.founded_organizations())
      AND (SELECT authz.acting_installation_id()) IS NULL));
CREATE POLICY resources_insert ON resources FOR INSERT TO app
  WITH CHECK ((kind IN ('folder', 'project')
      AND (organization_namespace_id, organization_id) IN (SELECT * FROM authz.organizations_reaching('admin'))
      AND parent_id = ANY (ARRAY(SELECT authz.resources_with('admin')))
      AND ((SELECT authz.acting_installation_id()) IS NULL
        OR (organization_namespace_id, organization_id, kind) IN (SELECT * FROM authz.capped_kinds('admin'))))
    OR (kind = 'ownable'
      AND archived_at IS NULL AND writers_can_share = FALSE
      AND (organization_namespace_id, organization_id) IN (SELECT * FROM authz.organizations_reaching('writer'))
      AND parent_id = ANY (ARRAY(SELECT authz.resources_with('writer')))
            AND created_by_id = (SELECT authz.caller_id())
      AND ((SELECT authz.acting_installation_id()) IS NULL
        OR (organization_namespace_id, organization_id, kind) IN (SELECT * FROM authz.capped_kinds('writer'))))
    OR (kind = 'organization'
      AND (organization_namespace_id, organization_id) IN (SELECT * FROM authz.founded_organizations())
      AND (SELECT authz.acting_installation_id()) IS NULL));
CREATE POLICY resources_update ON resources FOR UPDATE TO app
  USING (id = ANY (ARRAY(SELECT authz.resources_with('admin'))))
  WITH CHECK (id = ANY (ARRAY(SELECT authz.resources_with('admin'))));
