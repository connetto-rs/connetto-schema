name: Generated crates

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  synql:
    runs-on: ubuntu-26.04
    defaults:
      run:
        working-directory: generate
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust
        run: rustup toolchain install stable --profile minimal --component clippy,rustfmt && rustup default stable
      - name: Cache cargo
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            generate/target
            crates-target
          key: ${{ runner.os }}-crates-${{ hashFiles('generate/Cargo.lock') }}
      - name: Format
        run: cargo fmt --check
      - name: Clippy
        run: cargo clippy --locked --all-targets -- -D warnings
      - name: Documentation
        run: cargo doc --locked --no-deps
        env:
          RUSTDOCFLAGS: -D warnings
      - name: crates/ holds what synql writes
        run: |
          cargo run --locked --release
          git status --porcelain -- ../crates
          git diff -- ../crates
          test -z "$(git status --porcelain -- ../crates)"
      - name: The crates pass clippy
        working-directory: crates
        run: cargo clippy --workspace --all-targets -- -D warnings
        env:
          CARGO_TARGET_DIR: ${{ github.workspace }}/crates-target
