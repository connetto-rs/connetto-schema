[workspace]
resolver = "2"
members = ["./connetto-schema"]

[workspace.package]
edition = "2024"
license = "MIT"
repository = "https://github.com/connetto-rs/connetto-schema"

[workspace.dependencies]
connetto-schema = { version = "=0.1.0", path = "./connetto-schema" }
rosetta-utc = { version = "0.3.0", features = ["diesel", "serde", "postgres"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0" }
validation-errors = { version = "0.2.1" }
diesel = { version = "2.4.0", features = ["serde_json"] }
diesel-builders = { version = "0.2.1", features = ["postgres"] }
rosetta-uuid = { version = "0.2.0", features = ["diesel", "serde", "postgres"] }

[workspace.lints.rust]
unused_macro_rules = "forbid"
unused_doc_comments = "forbid"
unconditional_recursion = "forbid"
unreachable_patterns = "forbid"
unused_import_braces = "forbid"
unused_must_use = "forbid"
deprecated = "deny"

[workspace.lints.rustdoc]
broken_intra_doc_links = "forbid"
bare_urls = "forbid"
invalid_codeblock_attributes = "forbid"
invalid_html_tags = "forbid"
unescaped_backticks = "forbid"
redundant_explicit_links = "forbid"
invalid_rust_codeblocks = "forbid"
