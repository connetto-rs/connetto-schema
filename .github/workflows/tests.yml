name: Schema tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  postgres:
    name: PostgreSQL ${{ matrix.postgres }}
    runs-on: ubuntu-26.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        postgres: [17, 18]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust
        run: rustup toolchain install stable --profile minimal && rustup default stable
      - name: Cache cargo
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            tests/replica/target
          key: ${{ runner.os }}-replica-${{ hashFiles('tests/replica/Cargo.lock') }}
      - name: pgTAP behaviour tests, isolation specs and replica scenarios
        run: bash tests/run.sh ${{ matrix.postgres }}
