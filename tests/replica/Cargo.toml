[package]
name = "connetto-schema-replica"
version = "0.0.0"
edition = "2024"
publish = false
description = "Runs the connetto-schema core on the SQLite replica pg2sqlite translates it into, beside PostgreSQL"

[dependencies]
diesel = { version = "2.3", features = ["sqlite", "postgres"] }
libsqlite3-sys = { version = "0.40", features = ["bundled"] }
pg2sqlite = { git = "https://github.com/connetto-rs/pg2sqlite", branch = "main", default-features = false, features = ["std", "diesel"] }
pq-sys = { version = "0.7", features = ["bundled_without_openssl"] }
serde_json = "1"
sql-traits = { git = "https://github.com/connetto-rs/sql-traits", branch = "main" }
sqlparser = { git = "https://github.com/apache/datafusion-sqlparser-rs", branch = "main", features = ["visitor"] }
thiserror = "2"
uuid = { version = "1", features = ["v4"] }

[patch.crates-io]
diesel = { git = "https://github.com/diesel-rs/diesel", branch = "main" }
sqlparser = { git = "https://github.com/apache/datafusion-sqlparser-rs", branch = "main" }
sql-values = { git = "https://github.com/connetto-rs/sql-values", branch = "main" }

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
